{% extends "base.html" %}
{% from "partials/macros.html" import icon, mark, notices %}

{% block body %}
<header class="topbar">
    <div class="frame frame-narrow">
        <a class="brand" href="{{ url_for('index') }}">{{ mark() }} Student Feedback</a>
        <div class="topbar-aside">
            <span class="anon-note">{{ icon('lock', 14) }} Anonymous</span>
        </div>
    </div>
</header>

<main>
    <div class="frame frame-narrow">
        {{ notices() }}
        {% block content %}{% endblock %}
    </div>
</main>
{% endblock %}
