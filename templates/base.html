<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}Student Feedback{% endblock %}</title>
    <link rel="preload" href="{{ url_for('static', filename='fonts/atkinson-next-wght.woff2') }}" as="font" type="font/woff2" crossorigin>

</head>

<body>

</html>
